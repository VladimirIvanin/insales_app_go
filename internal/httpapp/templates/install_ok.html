<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Установка приложения</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; padding: 2rem; }
.container { max-width: 500px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; text-align: center; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #16a34a; }
p { color: #6b7280; }
</style>
</head>
<body>
<div class="container">
<h1>Установка получена</h1>
<p>Приложение установлено. Откройте приложение, чтобы проверить подключение и войти.</p>
</div>
</body>
</html>
