<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; line-height: 1.6; padding: 2rem; }
.container { max-width: 800px; margin: 0 auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 2rem; }
h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #1a1a1a; }
.shop-info { background: #f8f9fa; border-radius: 6px; padding: 1rem; margin-bottom: 1.5rem; }
.shop-info dt { font-weight: 600; color: #666; font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.05em; }
.shop-info dd { margin-bottom: 0.75rem; }
.action-buttons { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.5rem; }
.btn { display: inline-block; padding: 0.625rem 1.25rem; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 500; border: 1px solid transparent; cursor: pointer; }
.btn-primary { background: #4f46e5; color: #fff; }
.btn-primary:hover { background: #4338ca; }
.btn-danger { background: #ef4444; color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-outline { background: transparent; border-color: #d1d5db; color: #374151; }
.btn-outline:hover { background: #f3f4f6; }
.result-box { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 1rem; margin-top: 1rem; white-space: pre-wrap; font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.85rem; display: none; }
.result-box.error { background: #fef2f2; border-color: #fecaca; }
.alert { background: #fefce8; border: 1px solid #fde68a; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; font-size: 0.9rem; }
footer { margin-top: 2rem; font-size: 0.8rem; color: #9ca3af; text-align: center; }
</style>
</head>
<body>
<div class="container">
<h1>Панель приложения</h1>

<div class="shop-info">
<dl>
<dt>Магазин</dt>
<dd>{{.Shop}}</dd>
<dt>ID магазина</dt>
<dd>{{.StoreID}}</dd>
<dt>Название</dt>
<dd>{{.Title}}</dd>
<dt>Пользователь</dt>
<dd>{{.UserID}}</dd>
</dl>
</div>

{{if .ProbeResult}}
<div class="result-box {{if .ProbeError}}error{{end}}" style="display:block;">
{{.ProbeResult}}
</div>
{{end}}

<div class="action-buttons">
<form action="/probe?store_id={{.StoreID}}" method="POST">
<button type="submit" class="btn btn-primary">Проверить API</button>
</form>
<form action="/logout?store_id={{.StoreID}}" method="POST">
<button type="submit" class="btn btn-outline">Выйти</button>
</form>
</div>
</div>

<footer>InSales App &mdash; Go</footer>
</body>
</html>
